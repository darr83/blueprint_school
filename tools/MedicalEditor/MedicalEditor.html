<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Data Editor</title>
<!--
  Blueprint Hospital medical data editor.
  Open this file in Chrome or Edge, press "Open game data", pick the game's Data folder
  (or the Blueprint Hospital folder itself) and edit illnesses, symptoms, tests and medicines.
  "Save changes" writes straight back into the JSON files the game loads.
  The JSON files stay the source of truth: nothing is stored anywhere else.
-->
<style>
:root {
  --blue: #1F5FBF; --blue-soft: #E8F0FB; --ink: #1B2430; --muted: #5E6B7A; --line: #D9E0E8;
  --bg: #F4F6F9; --card: #FFFFFF; --red: #C62828; --red-soft: #FDECEC; --amber: #B26A00;
  --amber-soft: #FFF4E0; --green: #2E7D32; --green-soft: #E8F5E9;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--blue); }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:disabled { background: #9DB5DA; border-color: #9DB5DA; cursor: default; }
button.danger { color: var(--red); }
button.small { padding: 2px 7px; font-size: 12px; }
button.icon { padding: 2px 6px; line-height: 1; }
input, select, textarea { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid #9DB5DA; border-color: var(--blue); }
input[type=number] { width: 90px; }
input[type=checkbox] { width: 16px; height: 16px; vertical-align: middle; }
textarea { width: 100%; resize: vertical; min-height: 54px; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; color: var(--blue); }
header .where { color: var(--muted); font-size: 12px; flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--green-soft); color: var(--green); white-space: nowrap; cursor: pointer; border: 0; }
.status.bad { background: var(--red-soft); color: var(--red); }
.status.dirty { background: var(--amber-soft); color: var(--amber); }

main { flex: 1; display: flex; min-height: 0; }
nav { width: 300px; flex: none; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; padding: 9px 2px; font-size: 13px; border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.tabs .count { display: block; font-size: 11px; color: var(--muted); font-weight: normal; }
.navtools { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
.navtools input { flex: 1; }
.list { overflow-y: auto; flex: 1; }
.group { padding: 8px 10px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.item { padding: 6px 10px 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; border-left: 3px solid transparent; }
.item:hover { background: var(--bg); }
.item.on { background: var(--blue-soft); border-left-color: var(--blue); }
.item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.err { background: var(--red); }
.dot.dirty { background: var(--amber); }

.content { flex: 1; overflow-y: auto; padding: 16px 20px 60px; min-width: 0; }
.welcome { max-width: 640px; margin: 40px auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px 28px; }
.welcome h2 { margin-top: 0; color: var(--blue); }
.welcome li { margin: 4px 0; }
.title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.title-row h2 { margin: 0; font-size: 20px; flex: 1; min-width: 200px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 14px; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
.card .hint { color: var(--muted); font-size: 12px; margin: -6px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field.wide { grid-column: 1 / -1; }
.field > label, .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.field .help { font-size: 11px; color: var(--muted); }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check label { color: var(--ink); font-weight: normal; font-size: 14px; }
.pair { display: flex; gap: 6px; align-items: center; }
.pair span { color: var(--muted); font-size: 12px; }
.bad-input { border-color: var(--red) !important; background: var(--red-soft); }

table.rows { width: 100%; border-collapse: collapse; }
table.rows th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.rows td { padding: 4px 6px; border-bottom: 1px solid #EEF1F5; vertical-align: top; }
table.rows select, table.rows input[type=text] { width: 100%; }
.pct { display: flex; align-items: center; gap: 6px; }
.pct input[type=range] { flex: 1; min-width: 80px; }
.pct input[type=number] { width: 64px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { background: var(--blue-soft); color: var(--blue); border-radius: 12px; padding: 2px 4px 2px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip button { border: 0; background: transparent; color: inherit; padding: 0 4px; font-size: 14px; }
.chips select, .chips input { width: auto; max-width: 220px; }
.strings { display: flex; flex-direction: column; gap: 5px; }
.strings .row { display: flex; gap: 6px; }
.strings input { flex: 1; }
.sub-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #FAFBFD; }
.sub-card .head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.sub-card .head b { flex: 1; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { color: var(--blue); cursor: pointer; text-decoration: none; background: var(--blue-soft); padding: 2px 9px; border-radius: 12px; font-size: 13px; }
.links a:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.issues { background: var(--red-soft); border: 1px solid #F3C1C1; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; color: var(--red); }
.issues ul { margin: 4px 0 0; padding-left: 18px; }
.issues li { margin: 2px 0; }
.issues a { color: inherit; cursor: pointer; text-decoration: underline; }
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; max-width: 640px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(20, 30, 45, .35); }
dialog h3 { margin-top: 0; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
dialog .scroll { max-height: 50vh; overflow-y: auto; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.on { opacity: 1; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  nav { width: auto; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .content { padding: 12px 16px 40px; }
}
</style>
</head>
<body>
<header>
  <h1>Medical Data Editor</h1>
  <div class="where" id="where">No data folder open</div>
  <button class="status" id="status" hidden></button>
  <button id="openBtn" class="primary">Open game data</button>
  <input type="file" id="folderInput" webkitdirectory multiple hidden>
  <button id="saveBtn" class="primary" disabled>Save changes</button>
</header>
<main>
  <nav>
    <div class="tabs" id="tabs"></div>
    <div class="navtools">
      <input type="search" id="search" placeholder="Search…">
      <button id="newBtn" title="Add a new record">+ New</button>
    </div>
    <div class="list" id="list"></div>
  </nav>
  <div class="content" id="content"></div>
</main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";

// ---------------------------------------------------------------------------------------------
// Data store. Each kind maps to a folder under game/Data. Records are edited in place, so any
// field this editor does not know about is kept exactly as it was.
// ---------------------------------------------------------------------------------------------

const KINDS = {
  conditions:     { folder: "Conditions",     label: "Illnesses",  one: "illness" },
  symptoms:       { folder: "Symptoms",       label: "Symptoms",   one: "symptom" },
  investigations: { folder: "Investigations", label: "Tests",      one: "test" },
  medications:    { folder: "Medications",    label: "Medicines",  one: "medicine" },
};
const READ_ONLY = { departments: "Departments" };

const store = {
  mode: null,            // "fs" (File System Access, saves in place) or "download"
  root: null,            // directory handle for the Data folder (fs mode)
  rootName: "",
  files: {},             // kind -> [{ name, handle, indent, trailingNewline, records, dirty, deleted }]
  departments: [],
};
const fileOf = new WeakMap();   // record -> file entry

const ui = { kind: "conditions", selected: null, search: "", issues: [] };

const $ = (id) => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function records(kind) {
  return (store.files[kind] || []).filter(f => !f.deleted).flatMap(f => f.records);
}
function byId(kind, id) { return records(kind).find(r => r.id === id); }
function nameOf(kind, id) {
  if (kind === "departments") { const d = store.departments.find(x => x.id === id); return d ? d.name : id; }
  const r = byId(kind, id); return r ? (r.name || id) : id;
}
function touch(rec) {
  const f = fileOf.get(rec);
  if (f) f.dirty = true;
  scheduleRefresh();
}
function dirtyFiles() {
  return Object.values(store.files).flat().filter(f => f.dirty);
}

// ---------------------------------------------------------------------------------------------
// Loading and saving
// ---------------------------------------------------------------------------------------------

function parseFile(text, name) {
  const records = JSON.parse(text);
  if (!Array.isArray(records)) throw new Error(name + " does not hold a list of records.");
  const m = text.match(/^\[\r?\n([ \t]+)\S/);
  return {
    records,
    indent: m ? (m[1].includes("\t") ? "\t" : m[1].length) : 2,
    trailingNewline: /\n$/.test(text),
    crlf: /\r\n/.test(text),
  };
}
function serialise(file) {
  let text = JSON.stringify(file.records, null, file.indent);
  if (file.trailingNewline) text += "\n";
  if (file.crlf) text = text.replace(/\n/g, "\r\n");
  return text;
}

async function openFolder() {
  if (!window.showDirectoryPicker) { $("folderInput").click(); return; }
  let dir;
  try { dir = await window.showDirectoryPicker({ id: "blueprint-hospital-data", mode: "readwrite" }); }
  catch (e) { if (e.name !== "AbortError") alert("Could not open the folder: " + e.message); return; }
  try {
    dir = await findDataDir(dir);
    if (!dir) { alert("That folder doesn't contain the game's Data folder. Pick Blueprint Hospital, its game folder, or game\\Data."); return; }
    const loaded = {};
    for (const [kind, k] of Object.entries({ ...KINDS, ...Object.fromEntries(Object.entries(READ_ONLY).map(([a, b]) => [a, { folder: b }])) })) {
      loaded[kind] = [];
      let sub;
      try { sub = await dir.getDirectoryHandle(k.folder); } catch { continue; }
      for await (const [name, handle] of sub.entries()) {
        if (handle.kind !== "file" || !name.toLowerCase().endsWith(".json")) continue;
        const text = await (await handle.getFile()).text();
        loaded[kind].push({ name, handle, folder: k.folder, ...parseFile(text, k.folder + "/" + name) });
      }
    }
    install("fs", dir, dir.name, loaded);
  } catch (e) {
    alert("Could not read the data: " + e.message);
  }
}

async function findDataDir(dir) {
  const has = async (d, name) => { try { return await d.getDirectoryHandle(name); } catch { return null; } };
  if (await has(dir, "Conditions")) return dir;
  const data = await has(dir, "Data");
  if (data && await has(data, "Conditions")) return data;
  const game = await has(dir, "game");
  if (game) { const d = await has(game, "Data"); if (d && await has(d, "Conditions")) return d; }
  return null;
}

async function openFromInput(fileList) {
  // Fallback for browsers without folder write access: read every file, save as downloads.
  const loaded = {};
  const folders = { ...Object.fromEntries(Object.entries(KINDS).map(([k, v]) => [v.folder, k])), ...Object.fromEntries(Object.entries(READ_ONLY).map(([k, v]) => [v, k])) };
  let rootName = "";
  for (const file of fileList) {
    const parts = (file.webkitRelativePath || file.name).split("/");
    if (parts.length < 2 || !file.name.toLowerCase().endsWith(".json")) continue;
    const kind = folders[parts[parts.length - 2]];
    if (!kind) continue;
    rootName = parts.slice(0, -2).join("/");
    (loaded[kind] ||= []).push({ name: file.name, folder: parts[parts.length - 2], ...parseFile(await file.text(), file.name) });
  }
  if (!loaded.conditions) { alert("No Conditions folder found. Pick the game's Data folder."); return; }
  install("download", null, rootName, loaded);
}

function install(mode, root, rootName, loaded) {
  store.mode = mode; store.root = root; store.rootName = rootName;
  store.departments = (loaded.departments || []).flatMap(f => f.records);
  store.files = {};
  for (const kind of Object.keys(KINDS)) {
    store.files[kind] = (loaded[kind] || []).sort((a, b) => a.name.localeCompare(b.name));
    for (const f of store.files[kind]) for (const r of f.records) fileOf.set(r, f);
  }
  ui.selected = null;
  $("where").textContent = (mode === "fs" ? "Editing " : "Read from ") + rootName +
    (mode === "fs" ? " (saves straight into the game's files)" : " (this browser can't write to folders: saving downloads the changed files)");
  validate(); renderAll();
}

async function save() {
  validate();
  const errors = ui.issues.length;
  if (errors && !(await confirmDlg("Save with problems?",
      `There ${errors === 1 ? "is 1 problem" : `are ${errors} problems`} the game will refuse to load. The game's menu will list them until they are fixed. Save anyway?`, "Save anyway"))) return;
  const files = dirtyFiles();
  try {
    for (const f of files) {
      const kindFolder = f.folder;
      if (store.mode === "fs") {
        const dir = await store.root.getDirectoryHandle(kindFolder);
        if (f.deleted) { await dir.removeEntry(f.name); continue; }
        f.handle ||= await dir.getFileHandle(f.name, { create: true });
        const w = await f.handle.createWritable();
        await w.write(serialise(f));
        await w.close();
      } else if (!f.deleted) {
        const a = h("a", { href: URL.createObjectURL(new Blob([serialise(f)], { type: "application/json" })), download: f.name });
        document.body.append(a); a.click(); a.remove();
      }
    }
    for (const f of files) f.dirty = false;
    for (const kind of Object.keys(store.files)) store.files[kind] = store.files[kind].filter(f => !f.deleted);
    toast(store.mode === "fs"
      ? `Saved ${files.length} file${files.length === 1 ? "" : "s"}. Restart the game (or press Play in Godot) to load the changes.`
      : `Downloaded ${files.length} file${files.length === 1 ? "" : "s"}: copy them into the matching game/Data folders.`);
    renderAll();
  } catch (e) {
    alert("Saving failed: " + e.message);
  }
}

// ---------------------------------------------------------------------------------------------
// Validation: the same rules the game checks when it starts.
// ---------------------------------------------------------------------------------------------

const ID_RE = /^[a-z][a-z0-9_]*$/;
const TEST_ROOMS = ["x_ray", "ct", "echo", "eeg", "ultrasound", "endoscopy"];
const OBS = [
  ["heart_rate", "Heart rate", "bpm", 20, 250],
  ["systolic_bp", "Systolic BP", "mmHg", 40, 260],
  ["diastolic_bp", "Diastolic BP", "mmHg", 20, 160],
  ["respiratory_rate", "Respiratory rate", "/min", 4, 60],
  ["oxygen_saturation", "Oxygen saturation", "%", 50, 100],
  ["temperature", "Temperature", "°C", 30, 43],
];

function validate() {
  const out = [];
  const err = (kind, rec, field, msg) => out.push({ kind, rec, field, msg });
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const range = (kind, r, field, v, lo, hi) => {
    if (!isNum(v) || v < lo || v > hi) err(kind, r, field, `must be between ${lo} and ${hi}${isNum(v) ? ` (is ${v})` : ""}.`);
  };
  const text = (kind, r, field, v) => { if (typeof v !== "string" || !v.trim()) err(kind, r, field, "must not be empty."); };
  const id = (kind, r, field, v) => {
    if (typeof v !== "string" || !v) err(kind, r, field, "must not be empty.");
    else if (!ID_RE.test(v)) err(kind, r, field, `'${v}' is not a valid id: use lowercase letters, digits and underscores, starting with a letter.`);
  };
  const ids = (kind, r, field, list) => {
    (list || []).forEach((v, i) => id(kind, r, `${field} ${i + 1}`, v));
    const seen = new Set();
    for (const v of list || []) { if (seen.has(v)) err(kind, r, field, `lists '${v}' more than once.`); seen.add(v); }
  };
  const ref = (kind, r, field, refKind, v) => {
    if (v && !(refKind === "departments" ? store.departments.some(d => d.id === v) : byId(refKind, v)))
      err(kind, r, field, `refers to unknown ${refKind === "departments" ? "department" : KINDS[refKind].one} '${v}'.`);
  };

  for (const kind of Object.keys(KINDS)) {
    const seen = new Map();
    for (const r of records(kind)) {
      if (seen.has(r.id)) err(kind, r, "id", `'${r.id}' is used twice.`);
      seen.set(r.id, r);
    }
  }

  for (const c of records("conditions")) {
    const K = "conditions";
    id(K, c, "id", c.id); text(K, c, "name", c.name); id(K, c, "department", c.department);
    ref(K, c, "department", "departments", c.department);
    range(K, c, "prevalence", c.prevalence, 0.0001, 1000);
    const a = c.age_range || [];
    if (a.length !== 2 || a[0] < 0 || a[1] > 110 || a[0] > a[1]) err(K, c, "age range", "must be youngest to oldest, between 0 and 110.");
    range(K, c, "female fraction", c.female_fraction ?? 0.5, 0, 1);
    range(K, c, "ambulance probability", c.ambulance_probability ?? 0, 0, 1);
    id(K, c, "presenting complaint", c.presenting_complaint);
    const sy = c.symptoms || [];
    if (!sy.length) err(K, c, "symptoms", "must list at least one symptom.");
    sy.forEach((s, i) => { id(K, c, `symptom ${i + 1}`, s.symptom); range(K, c, `symptom ${i + 1} chance`, s.probability, 0, 1); ref(K, c, "symptoms", "symptoms", s.symptom); });
    if (c.presenting_complaint && !sy.some(s => s.symptom === c.presenting_complaint))
      err(K, c, "presenting complaint", `'${nameOf("symptoms", c.presenting_complaint)}' must also be listed in the symptoms.`);
    const o = c.observations || {};
    for (const [k, label, , lo, hi] of [...OBS, ["pain_score", "Pain score", "", 0, 10]]) {
      const p = o[k];
      if (!Array.isArray(p) || p.length !== 2) err(K, c, label, "needs two numbers.");
      else range(K, c, label, p[0], lo, hi);
    }
    const s = c.initial_severity || [];
    if (s.length !== 2 || s[0] < 0 || s[1] > 1 || s[0] > s[1]) err(K, c, "severity on arrival", "must be min to max between 0 and 1.");
    range(K, c, "deterioration per hour", c.deterioration_per_hour ?? 0, 0, 5);
    range(K, c, "recovery per hour", c.recovery_per_hour ?? 0, 0, 5);
    ids(K, c, "key tests", c.key_investigations);
    (c.key_investigations || []).forEach(v => ref(K, c, "key tests", "investigations", v));
    (c.treatment || []).forEach((t, i) => {
      if (t.type === "medication") { id(K, c, `treatment ${i + 1}`, t.medication); ref(K, c, `treatment ${i + 1}`, "medications", t.medication); }
      else {
        text(K, c, `treatment ${i + 1} name`, t.name);
        range(K, c, `treatment ${i + 1} minutes`, t.minutes ?? 5, 1, 600);
        if (t.room && t.room !== "plaster_room") err(K, c, `treatment ${i + 1} room`, "must be the plaster room or none.");
      }
    });
    const disp = c.disposition;
    if (!["discharge", "transfer", "admit", "surgery"].includes(disp)) err(K, c, "outcome", "must be discharge, transfer, admit or surgery.");
    if (c.ambulatory_hours) {
      const h2 = c.ambulatory_hours;
      if (disp !== "admit" || h2.length !== 2 || h2[0] < 1 || h2[1] < h2[0] || h2[1] > 12) err(K, c, "same-day care hours", "must be shortest to longest, up to 12 hours, and only for admitted illnesses.");
    }
    text(K, c, "outcome note", c.disposition_note);
    if (c.needs_intensive_care && disp !== "admit") err(K, c, "needs intensive care", "only applies when the outcome is admit.");
    if (disp === "surgery") {
      const op = c.operation;
      if (!op) err(K, c, "operation", "is required when the outcome is surgery.");
      else {
        text(K, c, "operation name", op.name);
        range(K, c, "operation minutes", op.minutes ?? 0, 10, 600);
        if (op.room && !["theatre", "cath_lab", "delivery_room"].includes(op.room)) err(K, c, "operation room", "must be theatre, cath lab or delivery room.");
        if (op.room === "delivery_room" && !c.maternity) err(K, c, "operation room", "only maternity illnesses can use the delivery room.");
        if (op.major && op.day_case) err(K, c, "operation", "can't be both major and a day case.");
      }
    }
    if (c.maternity) {
      const m = c.maternity;
      if (disp !== "surgery" || !c.operation) err(K, c, "maternity", "needs the outcome 'Operation' (the birth) with operation details.");
      const g = m.gestation_weeks || [37, 42];
      if (g.length !== 2 || g[0] < 20 || g[1] > 43 || g[0] > g[1]) err(K, c, "weeks pregnant", "must be earliest to latest, between 20 and 43.");
      range(K, c, "baby needs the neonatal unit", m.neonatal_chance ?? 0, 0, 1);
      range(K, c, "emergency caesarean chance", m.emergency_caesarean_chance ?? 0, 0, 1);
      range(K, c, "twins chance", m.twins_chance ?? 0, 0, 0.5);
      if ((m.emergency_caesarean_chance ?? 0) > 0) {
        const cs = byId("conditions", m.emergency_caesarean);
        if (!cs) err(K, c, "emergency caesarean", "must name the caesarean section illness.");
        else if (!cs.maternity || (cs.operation?.room ?? "theatre") !== "theatre") err(K, c, "emergency caesarean", `'${cs.name}' must be a maternity illness operated on in theatre.`);
      }
      if ((m.neonatal_chance ?? 0) > 0 && !(m.neonatal_reasons || []).filter(Boolean).length) err(K, c, "neonatal reasons", "list at least one reason a baby needs the neonatal unit.");
      const n = m.neonatal_stay_hours || [24, 96];
      if (n.length !== 2 || n[0] < 1 || n[1] < n[0] || n[1] > 1440) err(K, c, "neonatal stay", "must be shortest to longest hours, between 1 and 1440.");
    }
    const los = c.length_of_stay_hours || [24, 72];
    if (los.length !== 2 || los[0] < 1 || los[1] < los[0] || los[1] > 1440) err(K, c, "ward stay", "must be shortest to longest hours, between 1 and 1440.");
  }

  for (const s of records("symptoms")) {
    const K = "symptoms";
    id(K, s, "id", s.id); text(K, s, "name", s.name); text(K, s, "what the patient says", s.patient_description);
    ids(K, s, "triage tests", s.triage_investigations);
    (s.triage_investigations || []).forEach(v => ref(K, s, "triage tests", "investigations", v));
  }

  for (const t of records("investigations")) {
    const K = "investigations";
    id(K, t, "id", t.id); text(K, t, "name", t.name);
    range(K, t, "procedure minutes", t.procedure_minutes ?? 0, 1, 240);
    range(K, t, "turnaround minutes", t.turnaround_minutes ?? 0, 0, 1440);
    range(K, t, "cost", t.cost ?? 0, 0, 100000);
    range(K, t, "false positive rate", t.false_positive_rate ?? 0, 0, 1);
    const tmpl = (field, x) => {
      if (!x) return;

      if (x.value_range && (x.value_range.length !== 2 || x.value_range[0] > x.value_range[1])) err(K, t, field + " value range", "must be low to high.");
      if (!x.value_range && (x.summaries || []).some(v => v.includes("{value}"))) err(K, t, field + " reports", "use {value} but no value range is set.");
    };
    if (!t.normal) err(K, t, "normal result", "is required."); else tmpl("normal result", t.normal);
    if ((t.category === "imaging") !== TEST_ROOMS.includes(t.room)) err(K, t, "room", "imaging tests, and only imaging tests, need a room: X-ray, CT, echo, EEG, ultrasound or endoscopy.");
    if ((t.false_positive_rate || 0) > 0) { if (!t.false_positive) err(K, t, "false positive result", "is required when the false positive rate is above 0."); else tmpl("false positive result", t.false_positive); }
    (t.abnormal || []).forEach((a, i) => {
      const label = `result for ${nameOf("conditions", a.condition) || "illness " + (i + 1)}`;
      id(K, t, label, a.condition); range(K, t, label + " chance", a.probability, 0, 1); tmpl(label, a);
      ref(K, t, label, "conditions", a.condition);

  }

  for (const m of records("medications")) {
    const K = "medications";
    id(K, m, "id", m.id); text(K, m, "name", m.name); text(K, m, "drug class", m.drug_class);
    text(K, m, "route", m.route); text(K, m, "typical dose", m.typical_dose);
    ids(K, m, "allergy groups", m.allergy_groups);
    range(K, m, "cost per dose", m.cost_per_dose ?? 0, 0, 100000);
  }
  ui.issues = out;
}

function blank(kind) {
  if (kind === "conditions") return {
    id: "", name: "", department: "emergency", description: "", prevalence: 1, age_range: [18, 90], female_fraction: 0.5,
    ambulance_probability: 0.2, crew_assessment: "", presenting_complaint: "", symptoms: [],
    observations: { heart_rate: [85, 10], systolic_bp: [130, 15], diastolic_bp: [80, 10], respiratory_rate: [16, 2], oxygen_saturation: [97, 1], temperature: [36.9, 0.3], pain_score: [0, 3] },
    initial_severity: [0.1, 0.3], deterioration_per_hour: 0.02,
    deterioration_effects: { heart_rate: 20, systolic_bp: -30, respiratory_rate: 6, oxygen_saturation: -5, temperature: 0 },
    can_be_fatal: false, key_investigations: [], treatment: [], recovery_per_hour: 0.3, disposition: "discharge", disposition_note: "",
  };
  if (kind === "symptoms") return { id: "", name: "", patient_description: "", body_system: "general", is_red_flag: false };
  if (kind === "investigations") return { id: "", name: "", category: "blood", performed_by: "nurse", procedure_minutes: 5, turnaround_minutes: 60, cost: 20, applies_to_sex: "any", normal: { summaries: [""] }, false_positive_rate: 0, abnormal: [] };
  return { id: "", name: "", drug_class: "", route: "oral", typical_dose: "", indications: "", contraindications: "", allergy_groups: [], common_side_effects: [], cost_per_dose: 1 };
}
function slug(s) { let v = s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, ""); if (!/^[a-z]/.test(v)) v = "x_" + v; return v; }
function uniqueId(kind, base) { let id = base, n = 2; while (byId(kind, id)) id = `${base}_${n++}`; return id; }

async function newRecord() {
  const kind = ui.kind, k = KINDS[kind];
  const files = store.files[kind];
  const dlg = $("dlg");
  const name = h("input", { type: "text", placeholder: `Name of the new ${k.one}`, style: "width:100%" });
  const fileSel = h("select", { style: "width:100%" }, files.map(f => h("option", { value: f.name }, f.name)), h("option", { value: "__new" }, "A new file…"));
  const newFile = h("input", { type: "text", placeholder: "my_new_file.json", style: "width:100%", hidden: true });
  fileSel.addEventListener("change", () => { newFile.hidden = fileSel.value !== "__new"; });
  const preferred = kind === "conditions" && ui.selected ? fileOf.get(ui.selected)?.name : null;
  if (preferred) fileSel.value = preferred;
  dlg.replaceChildren(h("h3", {}, `New ${k.one}`),
    h("div", { class: "field", style: "margin-bottom:10px" }, h("label", {}, "Name"), name),
    h("div", { class: "field" }, h("label", {}, `Save it in ${k.folder}/`), fileSel, newFile),
    h("div", { class: "actions" }, h("button", { onclick: () => dlg.close("") }, "Cancel"), h("button", { class: "primary", onclick: () => dlg.close("ok") }, "Create")));
  dlg.returnValue = ""; dlg.showModal(); name.focus();
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") dlg.close("ok"); });
  await new Promise(r => dlg.addEventListener("close", r, { once: true }));
  if (dlg.returnValue !== "ok" || !name.value.trim()) return;
  let file;
  if (fileSel.value === "__new") {
    let fn = slug(newFile.value.replace(/\.json$/i, "") || name.value) + ".json";
    file = files.find(f => f.name === fn);
    if (!file) { file = { name: fn, folder: k.folder, indent: 2, trailingNewline: true, records: [], dirty: true }; files.push(file); }
  } else file = files.find(f => f.name === fileSel.value);
  const rec = blank(kind);
  rec.name = name.value.trim();
  rec.id = uniqueId(kind, slug(rec.name));
  if (kind === "conditions" && ui.selected && ui.kind === "conditions") rec.department = ui.selected.department;
  file.records.push(rec); fileOf.set(rec, file); file.dirty = true;
  validate(); select(kind, rec);
}

function duplicate(kind, rec) {
  const copy = JSON.parse(JSON.stringify(rec));
  copy.name = (rec.name || rec.id) + " (copy)";
  copy.id = uniqueId(kind, rec.id + "_copy");
  const f = fileOf.get(rec);
  f.records.splice(f.records.indexOf(rec) + 1, 0, copy); fileOf.set(copy, f); f.dirty = true;
  if (kind === "conditions") {
    // Copy how tests report it too, so the new illness can be diagnosed.
    for (const t of records("investigations")) for (const a of (t.abnormal || []).filter(x => x.condition === rec.id)) {
      t.abnormal.push({ ...JSON.parse(JSON.stringify(a)), condition: copy.id }); touch(t);
    }
  }
  validate(); select(kind, copy);
  toast("Copied. Give it a new name.");
}

function references(kind, id) {
  const out = [];
  if (kind === "symptoms") for (const c of records("conditions")) if ((c.symptoms || []).some(s => s.symptom === id) || c.presenting_complaint === id) out.push(["conditions", c]);
  if (kind === "medications") for (const c of records("conditions")) if ((c.treatment || []).some(t => t.medication === id)) out.push(["conditions", c]);
  if (kind === "investigations") {
    for (const c of records("conditions")) if ((c.key_investigations || []).includes(id)) out.push(["conditions", c]);
    for (const s of records("symptoms")) if ((s.triage_investigations || []).includes(id)) out.push(["symptoms", s]);
  }
  return out;
}

async function remove(kind, rec) {
  const refs = references(kind, rec.id);
  const extra = kind === "conditions" ? " Test results for it are removed too." : refs.length ? ` It is still used by ${refs.map(([, r]) => r.name).join(", ")}: those will show problems until you change them.` : "";
  if (!(await confirmDlg(`Delete ${rec.name || rec.id}?`, `This removes it from ${fileOf.get(rec).name} when you save.${extra}`, "Delete"))) return;
  const f = fileOf.get(rec);
  f.records.splice(f.records.indexOf(rec), 1); f.dirty = true;
  if (kind === "conditions") for (const t of records("investigations")) {
    const before = (t.abnormal || []).length;
    t.abnormal = (t.abnormal || []).filter(a => a.condition !== rec.id);
    if (t.abnormal.length !== before) touch(t);
  }
  ui.selected = null; validate(); renderAll();
}

function renameId(kind, rec, id) {
  const old = rec.id;
  rec.id = id; touch(rec);
  const fix = (r) => touch(r);
  if (kind === "conditions") for (const t of records("investigations")) for (const a of t.abnormal || []) if (a.condition === old) { a.condition = id; fix(t); }
  if (kind === "symptoms") for (const c of records("conditions")) {
    if (c.presenting_complaint === old) { c.presenting_complaint = id; fix(c); }
    for (const s of c.symptoms || []) if (s.symptom === old) { s.symptom = id; fix(c); }
  }
  if (kind === "medications") for (const c of records("conditions")) for (const t of c.treatment || []) if (t.medication === old) { t.medication = id; fix(c); }
  if (kind === "investigations") {
    for (const c of records("conditions")) { const i = (c.key_investigations || []).indexOf(old); if (i >= 0) { c.key_investigations[i] = id; fix(c); } }
    for (const s of records("symptoms")) { const i = (s.triage_investigations || []).indexOf(old); if (i >= 0) { s.triage_investigations[i] = id; fix(s); } }
  }
  validate(); renderContent(); renderList();
  toast(`Renamed to ${id} and updated every reference.`);
}

// ---------------------------------------------------------------------------------------------

function confirmDlg(title, text, okLabel) {
  const dlg = $("dlg");
  dlg.replaceChildren(h("h3", {}, title), h("p", {}, text),
    h("div", { class: "actions" }, h("button", { onclick: () => dlg.close("") }, "Cancel"), h("button", { class: "primary", onclick: () => dlg.close("ok") }, okLabel)));
  dlg.returnValue = ""; dlg.showModal();
  return new Promise(r => dlg.addEventListener("close", () => r(dlg.returnValue === "ok"), { once: true }));
}
let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 4000);
}

$("openBtn").addEventListener("click", async () => {
  if (dirtyFiles().length && !(await confirmDlg("Discard unsaved changes?", "Opening the data again loses changes you haven't saved.", "Discard"))) return;
  openFolder();
});
$("folderInput").addEventListener("change", (e) => { if (e.target.files.length) openFromInput(e.target.files); e.target.value = ""; });
$("saveBtn").addEventListener("click", save);
$("newBtn").addEventListener("click", newRecord);
$("status").addEventListener("click", () => { ui.selected = null; renderAll(); });
$("search").addEventListener("input", (e) => { ui.search = e.target.value; renderList(); });
window.addEventListener("beforeunload", (e) => { if (dirtyFiles().length) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (dirtyFiles().length) save(); } });

renderAll();
</script>
</body>
